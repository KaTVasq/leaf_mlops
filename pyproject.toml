[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leaf_mlops"
version = "0.1.0"
description = "MLOps platform for creating, annotating, versioning and managing tree-leaf image datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
images = ["Pillow>=10"]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "ruff>=0.5", "Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
